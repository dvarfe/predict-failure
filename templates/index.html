{% extends "base.html" %}

{% block content %}

<!-- Управление расписанием -->
<div style="text-align: center; margin-bottom: 2rem;">
    <a href="#schedule-modal" class="btn btn-large"
        style="background: #7ecfff; color: #181818; margin-right: 1rem; text-decoration: none;">
        Настроить расписание
    </a>
    <form method="post" action="/stop_schedule" style="display: inline;">
        <button type="submit" class="btn btn-large" style="background: #f44336; color: #fff;">
            Остановить сбор
        </button>
    </form>
</div>

<!--Девайсы-->
<form method="post" action="{{ url_for('main') }}">
    <div class="collectors-grid">
        {% for name, data in collectors.items() %}
        <div class="collector-block">
            <div class="collector-title">{{ name }}</div>
            <ul class="objects-list">
                {% for obj in data.objects %}
                <li>
                    <label style="color:white; display: inline-flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="{{ name }}_object" value="{{ obj }}" {% if obj in
                            data.get('selected', []) %}checked{% endif %}>
                        <span>{{ obj }}</span>
                        {% if obj in data.get('selected', []) %}
                        <span class="selected-dot" title="Selected"></span>
                        {% endif %}
                    </label>
                </li>
                {% else %}
                <li style="color:#888;">Нет объектов</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
    <div style="display: flex; justify-content: center; gap: 2rem; margin-top: 2rem;">
        <button type="submit" name="action" value="save" class="btn btn-large">Сохранить все настройки</button>
        <button type="submit" name="action" value="collect" class="btn btn-large">Запустить сбор</button>
    </div>
</form>

<!-- Подключение overlay из отдельного файла -->
{% include 'schedule_overlay.html' %}

{% endblock %}
